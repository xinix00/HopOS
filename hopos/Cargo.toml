[package]
name = "hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De kern-binary: kiest precies één board en start de executor."

[[bin]]
name = "hopos"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
board-qemuvirt = ["dep:board-qemuvirt"]
# De Pi's (board/raspi): image/rpi4.sh en image/rpi5.sh bouwen er een
# kaart-image van; `link-raspi.ld` in plaats van `link.ld` (build.rs).
board-rpi4 = ["dep:board-rpi4"]
board-rpi5 = ["dep:board-rpi5"]
# De Radxa Zero 3E (board/rk3566): image/radxa-zero3.sh bouwt er een
# kaart-image van; `link-rk3566.ld` in plaats van `link.ld` (build.rs).
board-rk3566 = ["dep:board-rk3566"]
# Het generieke UEFI-board (board/uefi): QEMU virt onder EDK2 en de basis
# van de O6N en de Altra. image/uefi-run.sh bouwt er BOOTAA64.EFI van;
# `efi.ld` in plaats van `link.ld`, als PIE (build.rs).
board-uefi = ["dep:board-uefi"]
# De Radxa Orion O6N en de Ampere Altra, op het UEFI-board:
# `BOARD=o6n|altra image/uefi-run.sh` bouwt er BOOTAA64.EFI van (efi.ld,
# PIE, zoals board-uefi; build.rs).
# Beide hebben DRAM vanaf 0x8000_0000: het kernvenster `window-8000` van
# board-uefi (0x8800_0000, de Go-kandidaat van de Altra), via de feature
# van hun eigen crate. Niet hier via `board-uefi/window-8000`: die vorm zet
# ook de feature `board-uefi` van deze binary aan, en dan zijn het er twee.
# (Tot 29-09 zette niemand hem aan en zocht de stub op beide het venster
# van QEMU, 0x5000_0000.) De O6N draait bovendien de hele kern onder
# E2H = 1 (`vhe`, de A720 eist het: Go 17-09).
board-o6n = ["dep:board-o6n", "board-o6n/window-8000", "board-o6n/vhe"]
board-altra = ["dep:board-altra", "board-altra/window-8000"]
# VHE afdwingen op een board dat anders nVHE kiest: de switcher-smaak `Vhe`
# (hopos/src/cage.rs `FLAVOR`) en de kern onder E2H = 1 (board-uefi `vhe`,
# board/uefi/src/el2.rs). De proef op QEMU met een VHE-model
# (`FEATURES=vhe CPU=neoverse-n1 sh tools/qemu-uefi-test.sh`) vóór de O6N.
# Alleen het UEFI-board kent de VHE-kern; op een ander board weigert de
# build (cage.rs).
vhe = ["board-uefi?/vhe"]
# De riscv64-boards (`--target riscv64gc-unknown-none-elf`, docs/boards-riscv.md):
# QEMU virt in machine mode (`-bios none`, tools/qemu-riscv-test.sh) en de
# Sipeed LicheeRV Nano (SG2002, image/licheerv-agent.sh). Beide linken met
# `link-riscv.ld` (build.rs), elk op zijn eigen basis.
board-qemuvirt-riscv = ["dep:board-qemuvirt-riscv"]
board-licheerv = ["dep:board-licheerv"]
# De Mac mini M4 (board/apple): een raw image achter m1n1 of als eigen
# bootobject (image/apple-m4.sh, docs/boards-apple.md); `link-apple.ld`,
# gelinkt op 1 TiB + 4 GB (build.rs).
board-apple = ["dep:board-apple"]

# Het gui-vlak (gui.rs, docs/gui.md): de console op het glas als het board
# een framebuffer geeft, de meetregels naast de bunny, en de
# framebuffer-grant aan de display-app. Kaal linkt er geen regel van mee.
# De `?`-vorm zet de gui van alleen het gekozen board aan.
gui = [
    "dep:driver-fb",
    "dep:gui-fbgrant",
    "dep:gui-usbin",
    "dep:driver-xhci",
    "dep:driver-hid",
    "dep:driver-dwc3",
    "board-qemuvirt?/gui",
    "board-rpi4?/gui",
    "board-rpi5?/gui",
    "board-rk3566?/gui",
    "board-uefi?/gui",
    "board-o6n?/gui",
    "board-altra?/gui",
]

# Het media-vlak (codec.rs, docs/media.md): de codec-ops van de system-API
# en de VPU-driver; op de O6N zet `board-o6n?/media` het aanzetten van de
# VPU aan. Kaal antwoorden de codec-ops "onbekende op".
media = [
    "gui",
    "dep:media-optical",
    "kern/media",
    "dep:driver-codec",
    "dep:media-mve",
    "dep:bounded",
    "board-o6n?/media",
]

# Alleen wat de binary gebruikt (een ongebruikte dep bouwt alleen mee).
[dependencies]
sync = { path = "../sync" }
executor = { path = "../executor" }
cpu = { path = "../cpu" }
dev = { path = "../dev" }
abi = { path = "../abi" }
netdev = { path = "../netdev" }
net = { path = "../net" }
kern = { path = "../kern" }
# Het blokcontract: `Paced` en `block_on` rond de schijf van het board
# (storage.rs, bench.rs).
blkdev = { path = "../blkdev" }
board = { path = "../board" }
# De lezer van `hopos.cfg` (config.rs: van de sleutels naar de env van Hop).
fw = { path = "../fw" }
# De node-stack en de DHCP-client (PORT.md §2.1), op een tag en nooit over
# een pad: lean is een eigen repo met een eigen versie.
leannet = { git = "https://github.com/xinix00/lean.git", tag = "v3.0.0" }
leandhcp = { git = "https://github.com/xinix00/lean.git", tag = "v3.0.0" }
# De ELF-lezer van de eerste plaatsing (slots.rs), zelfde tag.
leanelf = { git = "https://github.com/xinix00/lean.git", tag = "v3.0.0" }
board-qemuvirt = { path = "../board/qemuvirt", optional = true }
board-rpi4 = { path = "../board/rpi4", optional = true }
board-rpi5 = { path = "../board/rpi5", optional = true }
board-rk3566 = { path = "../board/rk3566", optional = true }
board-uefi = { path = "../board/uefi", optional = true }
board-o6n = { path = "../board/o6n", optional = true }
board-altra = { path = "../board/altra", optional = true }
board-qemuvirt-riscv = { path = "../board/qemuvirt-riscv", optional = true }
board-licheerv = { path = "../board/licheerv", optional = true }
board-apple = { path = "../board/apple", optional = true }
# Het gui-vlak (feature `gui`): de console en het grant-beleid.
driver-fb = { path = "../driver/fb", optional = true }
gui-fbgrant = { path = "../gui/fbgrant", optional = true }
# De USB-invoer (gui.rs `usb`, net.rs `input`): de manager en de bezorging,
# de xHCI, de HID-gebeurtenissen en de DWC3 van de RK3566.
gui-usbin = { path = "../gui/usbin", optional = true }
driver-xhci = { path = "../driver/usb/xhci", optional = true }
driver-hid = { path = "../driver/usb/hid", optional = true }
driver-dwc3 = { path = "../driver/usb/dwc3", optional = true }
# Het media-vlak (feature `media`): het contract en de VPU-driver.
driver-codec = { path = "../driver/codec", optional = true }
media-mve = { path = "../media/mve", optional = true }
media-optical = { path = "../media/optical", optional = true }
bounded = { path = "../bounded", optional = true }
# De schijf van het board: `storage.rs` kent haar maten (sector, transfer).
driver-virtioblk = { path = "../driver/virtioblk" }

[lints]
workspace = true
