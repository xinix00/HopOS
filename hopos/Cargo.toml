[package]
name = "hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De kern-binary: kiest precies één board en start de executor."

[[bin]]
name = "hopos"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
board-qemuvirt = ["dep:board-qemuvirt"]

# Alleen wat de binary nu gebruikt: `net` en `kern` komen erbij zodra hun
# taken hier gespawnd worden (een ongebruikte dep bouwt alleen mee).
[dependencies]
sync = { path = "../sync" }
executor = { path = "../executor" }
cpu = { path = "../cpu" }
netdev = { path = "../netdev" }
board = { path = "../board" }
board-qemuvirt = { path = "../board/qemuvirt", optional = true }

[lints]
workspace = true
