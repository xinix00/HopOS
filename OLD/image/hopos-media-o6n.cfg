# Orion O6N media-node — lokale opstelling van Derek, HopOS v2.2.8+.
# Zet dit bestand als hopos.cfg in de root van de UEFI-bootstick.
# Gebruik de MEDIA-release (BOOTAA64-o6n-media.EFI), geen headless kernel.
# De compacte init-job is gelijk aan ../job-lumen.json.
# Het ELF-bestand wordt bij iedere koude start opgehaald van de Mac op :8002.
# Start de artifactserver zoals beschreven in docs/media-o6n.md.

hopos.node=hopos-1
hopos.insecure=1
hopos.console=5555
hopos.cores=1
hopos.flip.enable=1
hopos.clock=dvfs
hopos.codec=768

# Dit is de echte opslaginstelling. WEBDAV_STORAGE in de job past alleen
# de melding in Lumen aan; die jobvariabele activeert geen persistentie.
hopos.storage=stateful

# Alleen Lumen; geen display, launcher, welcome of andere init-jobs.
hopos.init[]={"name":"lumen","driver":"hop","artifacts":[{"url":"http://192.168.1.208:8002/lumen-20260928-1.elf","match":{"node.arch":"arm64"}}],"ports":{"http":8099,"ui":8098},"cpu_shares":11264,"memory_limit":25769803776,"env":{"WEBDAV_MOUNTS":"/mounts","WEBDAV_ROOT":"/media","WEBDAV_WRITE":"1","WEBDAV_BACKUP_PROFILE":"faster-b2","WEBDAV_STORAGE":"stateful"},"volumes":{"/devices":"/mounts","/mediakeys":"/aacs","/medialib":"/media","/firmware":"/codec-firmware","/lumen-notifications":"/notifications"},"max_restarts":0,"update_policy":"recreate","priority":0,"affinity":{"node.id":"hopos-1"}}
