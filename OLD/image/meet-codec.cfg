# Meetbundel: alleen wat de stick niet zet. De stick-config wint voor al het
# andere (naam, apikey, console), dus dit raakt de node-identiteit niet.
#
# chunk=16384 KB: de hele teststream in één hap. Een hap die middenin een beeld
# eindigt levert een CORRUPT beeld op — knippen hoort op access-unit-grenzen,
# en dat is werk voor de demuxer, niet voor het meetinstrument.
# codec=768 MB: 4K10 referentieframes zijn 24MB per stuk; met 256MB loopt de
# firmware-arena leeg en eindigt dat in een MMU ABORT.
hopos.codec=768
hopos.codecdemo=/data/clip.hevc
hopos.codecdemo.chunk=16384
