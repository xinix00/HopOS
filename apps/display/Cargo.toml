[package]
name = "display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De display-app: houdt het glas van de node (de framebuffer-grant), tekent een achtergrond, een klok en de laatste invoer, en leest toetsenbord en muis van de kern."
build = "build.rs"

[[bin]]
name = "display"
path = "src/main.rs"
bench = false

[dependencies]
applib = { path = "../../applib" }
sync = { path = "../../sync" }
dev = { path = "../../dev" }
# Het font van de console van de kern: één font op het glas.
driver-fb = { path = "../../driver/fb" }

[lints]
workspace = true
