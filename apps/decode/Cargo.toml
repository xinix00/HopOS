[package]
name = "decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Een stream van het volume of van een URL door de hardwaredecoder van de node, met de fps erbij (docs/media.md)."
build = "build.rs"

[[bin]]
name = "decode"
path = "src/main.rs"
bench = false

[dependencies]
# De codec-client (feature `media`) en de TcpConn-brug naar leanhttp
# (feature `http`) voor een stream van een URL.
applib = { path = "../../applib", features = ["media", "http"] }
bounded = { path = "../../bounded" }
# HTTP/1.1 zonder TLS (PORT.md §2.1), op een tag en nooit over een pad:
# dezelfde tag als applib en Hop.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.1" }

[lints]
workspace = true
