[package]
name = "welcome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De eerste Rust-app van HopOS v3: één pagina op de gepubliceerde poort, met de bunny, de node, het slot en de tellers."
build = "build.rs"

[[bin]]
name = "welcome"
path = "src/main.rs"
bench = false

[dependencies]
applib = { path = "../../applib", features = ["http"] }
sync = { path = "../../sync" }
# HTTP/1.1 zonder TLS (PORT.md §2.1), op een tag en nooit over een pad:
# lean is een eigen repo met een eigen poort. Dezelfde tag als Hop.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11" }

[lints]
workspace = true
