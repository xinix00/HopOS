# Platform-config voor de Mac mini M4-meetbank (haas-server01). Gaat via de
# loader (CFG=image/apple/hopos-m4.cfg) als tekst naar apple.CfgBase; zelfde
# key=waarde-formaat als hopos-headless.cfg. Sleutels horen NIET hier.
hopos.node=m4-mini-01
hopos.console=5555
hopos.insecure=1

# De welcome-app van de release-tag. Dit is tegelijk de end-to-end-proef van het
# netwerk: DNS, uitgaand TCP, TLS (dus ook de klok) en de kooi, allemaal in één
# regel. Zonder netwerk blijft de job in queued staan en gebeurt er verder niets.
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-arm64-tamago.elf"}],"memory_limit":67108864,"ports":{"http":80}}

# NETBOOT — UIT, en dat is de afspraak (Derek, 30-08): updaten gaat via de
# console, vol image, klaar. Deze twee regels staan hier als documentatie voor
# wie tijdens bring-up een 1TR-reis wil uitsparen; haal het commentaarteken weg
# en de node haalt zijn volgende kern van het net.
#
# BRING-UP-GEREEDSCHAP VOOR EEN MEETBANK, geen update-mechanisme.
# Op dit board kost elk nieuw image een fysieke 1TR-reis; met deze regel haalt
# de node zijn volgende kern van het net en scheelt dat een tocht. Zet hem NIET
# op een productienode: één verkeerde URL en elke node die hem heeft, trekt
# hetzelfde verkeerde image binnen. Zonder deze regel verandert er niets.
#
# De handtekening is niet optioneel (kern van het net = code met alle rechten).
# Teken met tools/netboot-sign.go; de publieke helft staat hieronder en de
# private helft blijft op de bouwmachine (~/.hopos/netboot_key).
#
# Mislukt het ophalen of klopt de handtekening niet, dan boot de node gewoon
# door op het image dat op de machine staat. Netboot is een upgrade-pad, geen
# afhankelijkheid.
#hopos.netboot=http://192.168.1.208:8099/hopos-apple.img
#hopos.netboot.key=DIJejar3IDo9DpqZzvJ0mRSl5QjwZJ8JT2AZBEwfLZw=
