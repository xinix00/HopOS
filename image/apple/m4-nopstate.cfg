# Platform-config voor de Mac mini M4-meetbank (haas-server01). Gaat via de
# loader (CFG=image/apple/hopos-m4.cfg) als tekst naar apple.CfgBase; zelfde
# key=waarde-formaat als hopos-headless.cfg. Sleutels horen NIET hier.
hopos.node=m4-mini-01
hopos.console=5555
hopos.insecure=1

# De welcome-app van de release-tag. Dit is tegelijk de end-to-end-proef van het
# netwerk: DNS, uitgaand TCP, TLS (dus ook de klok) en de kooi, allemaal in één
# regel. Zonder netwerk blijft de job in queued staan en gebeurt er verder niets.
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-arm64-tamago.elf"}],"memory_limit":67108864,"ports":{"http":80}}

# --- Live kernel update: de flip (docs/kern-flip.md) ---------------------------
# hopos.flip.enable laat deze node zichzelf live vervangen (de switch-code die
# een app-core draait verhuist dan naar de plan-regio). Default aan; uitzetten
# geeft byte-voor-byte het gedrag van vóór de flip bestond.
hopos.flip.enable=1
# De flip wordt AANGEVRAAGD, via de agent-API — dat is de enige weg, en hij
# zit achter dezelfde auth als job-dispatch (hopos.apikey; op deze bank open
# via hopos.insecure=1):
#   1. CFG=image/apple/hopos-m4.cfg image/flip-bundle.sh apple   (print de sha)
#   2. zet hopos-apple.flip op een webserver die deze node kan bereiken
#   3. curl -X POST http://<node>:8080/flip \
#        -d '{"url":"<url>","sha256":"<sha>"}'

# proefbundel: klok NIET aanraken — test of de dubbele PStateTune de flip-landing doodt
hopos.pstate=off
