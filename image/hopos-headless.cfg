# HopOS node config — headless default. This file ships with every headless
# release asset; edit it on the boot medium (FAT — any computer mounts it)
# and boot. Editing this file IS node management: no shell, no rebuild.
#
# NO EDIT IS REQUIRED to boot: write the card and the node comes up serving one
# page on port 80, so you can see it is alive. A headless node runs no desktop —
# you give it work over the HOP API, or seed it below. The one edit to make
# before this node leaves a trusted LAN is hopos.apikey below — until then the
# API is open, and the node says so on every boot.
#
# Where it lives:  UEFI stick → next to EFI/ in the root, named hopos.cfg
#                  Raspberry Pi → on the SD bootfs, named hopos.cfg
# Format: key=value, one per line — the value is the rest of the line, so full
# job-spec JSON (same schema as the HOP API) is fine as long as it stays on one
# line. Lines starting with # are comments. Docs:
# https://github.com/xinix00/HopOS/blob/main/docs/config.md

# --- Identity (optional) ------------------------------------------------------
# Without hopos.node the node names itself after its board serial. Nodes
# sharing a hopos.cluster name form one cluster — the S3 block at the bottom
# is what actually binds them together.
#hopos.node=hop-1
#hopos.cluster=hoplab

# --- Console over the network (on by default) ----------------------------------
# The node's console — the same lines a serial cable would give you, including
# the post-mortem of a job that died — on a plain TCP port: `nc <node> 5555`.
# On by default, and on a headless node doubly so: there is no screen, so this
# port and the UART pins are the only two console channels this node has —
# and the UART needs a cable at the board (04-08: a crashing app on a card
# without this line left us blind). Read-only and unauthenticated, so on a
# hostile network set it to 0 (off).
hopos.console=5555

# --- API key (set one before this node leaves your LAN) -------------------------
# The HTTP API (agent :8080, leader :9080) is what dispatches jobs to this node.
# Out of the box it is OPEN: no key, no authentication — so a freshly written
# card boots into a working node and you can try it in one step. On a headless
# node that API is the ONLY way in, so an unusable API is an unusable node.
#
# That is a deliberate trade, and the node says it out loud on every boot
# ("API authentication is OFF"). Anyone who can reach it can run code on it, so
# an open node belongs on a LAN you trust and nowhere else.
#
# Close it: generate a key, put it below, and remove the insecure line. The two
# are mutually exclusive — with a key set the API authenticates, and without
# either line the node refuses to start the API at all rather than sit open by
# accident.
#
#     openssl rand -hex 24
#
# Use the SAME key on every node of a cluster.
hopos.insecure=1
#hopos.apikey=

# --- Init jobs: the welcome page (the headless default) -------------------------
# Jobs seeded on a clean boot, so the node comes out of the box running
# something — one compact-JSON job per line, same schema as POST /v1/jobs.
#
# The default is one job: `welcome`, a page on port 80 that proves the node is
# up and shows what it is running on (cores, RAM partition, architecture,
# uptime). Open http://<node-ip>/ — that is the whole install check. It needs
# no key, no address and no configuration: HopOS hands every app the node
# address itself.
#
# Two artifacts, one job: `match` constrains an artifact to node attributes and
# the agent takes the first one that fits, so this same line boots on an arm64
# board (Pi, UEFI) and on a RISC-V node (LicheeRV Nano). An artifact without
# `match` is the catch-all — put that one last.
#
# Replace it with your own workload — delete this line, add yours:
#hopos.init[]={"name":"myservice","driver":"hop","artifacts":[{"url":"https://example.com/myservice.elf"}],"memory_limit":67108864,"ports":{"http":80}}
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-arm64-tamago.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-riscv64-tamago.elf","match":{"node.arch":"riscv64"}}],"memory_limit":67108864,"ports":{"http":80}}

# --- Live kernel updates: the flip (on by default) -----------------------------
# This node can replace its own kernel WITHOUT rebooting: the new HopOS is
# placed in memory borrowed from the app pool, the running one jumps into it,
# and the apps keep running straight through it — same cores, same partitions,
# same open connections, same mounted volumes. Their heartbeats do not even
# skip a beat. HOP's own task administration comes along too, so the node knows
# afterwards exactly what it was running.
#
# What this line does is make the node CAPABLE of it. It costs nothing on a
# node that never flips (the switch code an app core runs moves into HopOS's
# own plan region instead of the kernel image, and that is all); set it to 0
# and this node behaves exactly as it did before the feature existed.
#
# Doing an actual flip is a separate, deliberate act — see below.
hopos.flip.enable=1

# A flip is REQUESTED through the agent API — the only trigger, behind the
# same auth as job dispatch (hopos.apikey):
#   1. image/flip-bundle.sh <board>          (prints the bundle's sha256)
#   2. put the bundle on a webserver this node can reach
#   3. POST /flip {"url":...,"sha256":...} to the node's agent port

# --- S3: what makes nodes a CLUSTER (optional) ----------------------------------
# S3 is the cluster glue, not just storage. Nodes with the same hopos.cluster
# and the same S3 settings elect one leader through an S3 lock object; the
# winner advertises its address in that lock, so every node finds the leader
# without any node knowing another node's IP — and when the leader dies, the
# next node takes the lock over. The same bucket carries the committed
# cluster state: your jobs reload after any reboot or power cut.
# Leave unset for a standalone node (every boot is a clean boot, the init
# jobs above are seeded fresh each time).
#hopos.s3.endpoint=https://s3.example.com
#hopos.s3.bucket=hop-prod
#hopos.s3.region=eu
#hopos.s3.key=<access-key-id>
#hopos.s3.secret=<secret-access-key>
#hopos.s3.pathstyle=1
