# HopOS node config — headless default. This file ships with every headless
# release asset; edit it on the boot medium (FAT — any computer mounts it)
# and boot. Editing this file IS node management: no shell, no rebuild.
#
# ONE EDIT IS REQUIRED: set hopos.apikey below. A headless node runs no
# desktop — you give it work over the HOP API, or seed it below. Out of the
# box it serves one page on port 80 so you can see the node is alive.
#
# Where it lives:  UEFI stick → next to EFI/ in the root, named hopos.cfg
#                  Raspberry Pi → on the SD bootfs, named hopos.cfg
# Format: key=value, one per line — the value is the rest of the line, so full
# job-spec JSON (same schema as the HOP API) is fine as long as it stays on one
# line. Lines starting with # are comments. Docs:
# https://github.com/xinix00/HopOS/blob/main/docs/config.md

# --- Identity (optional) ------------------------------------------------------
# Without hopos.node the node names itself after its board serial. Nodes
# sharing a hopos.cluster name form one cluster — the S3 block at the bottom
# is what actually binds them together.
#hopos.node=hop-1
#hopos.cluster=hoplab

# --- API key (REQUIRED) -------------------------------------------------------
# HMAC key for the HTTP API (agent :8080, leader :9080). Without it the node
# refuses to start its API — an open API would let any host on your LAN run
# code on this node. Generate one:
#
#     openssl rand -hex 24
#
# Use the SAME key on every node of a cluster. Deliberately want an open API
# on a trusted bench? Comment the key and uncomment the insecure line below.
hopos.apikey=
#hopos.insecure=1

# --- Init jobs: the welcome page (the headless default) -------------------------
# Jobs seeded on a clean boot, so the node comes out of the box running
# something — one compact-JSON job per line, same schema as POST /v1/jobs.
#
# The default is one job: `welcome`, a page on port 80 that proves the node is
# up and shows what it is running on (cores, RAM partition, architecture,
# uptime). Open http://<node-ip>/ — that is the whole install check. It needs
# no key, no address and no configuration: HopOS hands every app the node
# address itself.
#
# Two artifacts, one job: `match` constrains an artifact to node attributes and
# the agent takes the first one that fits, so this same line boots on an arm64
# board (Pi, UEFI) and on a RISC-V node (LicheeRV Nano). An artifact without
# `match` is the catch-all — put that one last.
#
# Replace it with your own workload — delete this line, add yours:
#hopos.init[]={"name":"myservice","driver":"hop","artifacts":[{"url":"https://example.com/myservice.elf"}],"memory_limit":67108864,"ports":{"http":80}}
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop/releases/download/rolling-release/welcome-arm64-tamago.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/xinix00/hop/releases/download/rolling-release/welcome-riscv64-tamago.elf","match":{"node.arch":"riscv64"}}],"memory_limit":67108864,"ports":{"http":80}}

# --- S3: what makes nodes a CLUSTER (optional) ----------------------------------
# S3 is the cluster glue, not just storage. Nodes with the same hopos.cluster
# and the same S3 settings elect one leader through an S3 lock object; the
# winner advertises its address in that lock, so every node finds the leader
# without any node knowing another node's IP — and when the leader dies, the
# next node takes the lock over. The same bucket carries the committed
# cluster state: your jobs reload after any reboot or power cut.
# Leave unset for a standalone node (every boot is a clean boot, the init
# jobs above are seeded fresh each time).
#hopos.s3.endpoint=https://s3.example.com
#hopos.s3.bucket=hop-prod
#hopos.s3.region=eu
#hopos.s3.key=<access-key-id>
#hopos.s3.secret=<secret-access-key>
#hopos.s3.pathstyle=1
