# HopOS node config — LicheeRV Nano (RISC-V) default. Unlike every other
# board, this file is NOT read from the boot medium: image/licheerv-agent.sh
# bakes it into the image (-tags embedcfg) because this board cannot read its
# own FAT partition — the vendor first-stage loader reads the card, HopOS has no
# SD driver. The config is therefore part of the image you flash: change it,
# rebuild, reflash. Or bake your own without touching this file:
#
#     CFG=~/my-node.cfg image/licheerv-agent.sh /dev/diskN
#
# Keep real keys out of the repo — a CFG file of your own is the place for them.

# --- Identity -----------------------------------------------------------------
hopos.node=hopos-lrv

# --- API key ------------------------------------------------------------------
# No key on this board yet, so the API is deliberately open: this is a bench
# node on a trusted LAN. Set hopos.apikey (and drop hopos.insecure) in your own
# CFG file the moment it sits anywhere else.
hopos.insecure=1

# --- Console over the network ------------------------------------------------
# Same stream the serial line carries: connect and you get the retained history
# first, then live output. `nc 192.168.2.3 5555`.
#
# Off unless set, and worth keeping that way outside a bench: this port hands
# every reader everything the node prints, including what HOP says about its
# jobs. On this board it is on because the serial line is the problem it solves
# — no cable means no reason for a refused job, and with a cable the line still
# drops bytes at 115200.
hopos.console=5555

# --- Init jobs ----------------------------------------------------------------
# One job: `welcome`, a page on port 80 that says the node is up and what it
# runs on. Two artifacts, one job — `match` picks the build for this node's
# architecture (the agent resolves it per node), so this is literally the same
# line the arm64 boards use.
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop/releases/download/rolling-release/welcome-arm64-tamago.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/xinix00/hop/releases/download/rolling-release/welcome-riscv64-tamago.elf","match":{"node.arch":"riscv64"}}],"memory_limit":67108864,"ports":{"http":80}}
