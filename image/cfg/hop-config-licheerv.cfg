# HopOS v3, de gedeelde config van elke node zonder glas (docs/boards.md,
# "De config"). Eén bestand voor alle boards, zodat er geen per board
# achterraakt; de image-scripts nemen hem als CFG= ontbreekt, en een eigen
# CFG= vervangt hem helemaal. De sleutels staan in kern/src/nodecfg.rs.
#
# Geen hopos.node: zonder heet de node naar zijn board en de laatste twee
# bytes van zijn uplink-MAC (rpi4-4c54). Op de Pi's wordt elke regel een
# token in cmdline.txt, dus nergens een spatie in een waarde.
#
# Open op het eigen LAN: de API zonder sleutel en de console over TCP.
# Voor een node buiten je eigen net: een eigen CFG= met hopos.apikey en
# zonder hopos.insecure.
hopos.cluster=hopos
hopos.insecure=1
hopos.console=1
hopos.cages=on
hopos.replay=0
# De LicheeRV als enige: twee cores, dus Hop op zijn eigen core (de C906L,
# groep `hop`) en de OS-core (de C906B) als groep `system` voor de apps;
# het bord is te klein voor de algemene config.
hopos.hop.sharegroup=hop
# De eerste job: welcome op poort 80, van de rollende release `apps`
# (jobs/README.md, het naamschema <app>-<arch>.elf).
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-arm64.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-riscv64.elf","match":{"node.arch":"riscv64"}}],"memory_limit":33554432,"ports":{"http":80}}
