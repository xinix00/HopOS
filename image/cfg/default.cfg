# HopOS v3, laag 1 van 3: de default van elke node (docs/boards.md, "De
# config"). Het venster van de kern krijgt default.cfg, dan <bord>.cfg, dan
# headless.cfg of headfull.cfg, aaneengeplakt; de laatste waarde van een
# sleutel wint, een herhaalde sleutel (hopos.init[]) telt alle lagen. Een
# eigen config: cat default.cfg <bord>.cfg <smaak>.cfg eigen.cfg. De
# sleutels staan in kern/src/nodecfg.rs.
#
# Geen hopos.node: zonder heet de node naar zijn board en de laatste twee
# bytes van zijn uplink-MAC (rpi4-4c54).
#
# Open op het eigen LAN: de API zonder sleutel en de console over TCP.
# Voor een node buiten je eigen net: een eigen laag met hopos.apikey en
# hopos.insecure=0.
hopos.cluster=hopos
hopos.insecure=1
hopos.console=1
hopos.cages=on
hopos.replay=0
# Een device begint schoon en vergeet alles: stateless negeert bij een koude
# boot het indexbestand van de schijf. Een node die moet onthouden (de boom
# op de schijf, Hop's staat op /hop/) zet in zijn eigen laag
# hopos.storage=stateful.
hopos.storage=stateless
