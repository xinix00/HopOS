# HopOS v3, de gedeelde config van elke node met glas, en van de
# media-smaak (docs/boards.md, "De config"). Hoort bij een kern met de
# gui-feature (GUI=1 of MEDIA=1); de image-scripts nemen hem alleen met
# CFG=, tools/release.sh voor elke headfull-build. De sleutels staan in
# kern/src/nodecfg.rs; wat hier staat is wat de headless-config ook zet.
#
# Geen hopos.node: zonder heet de node naar zijn board en de laatste twee
# bytes van zijn uplink-MAC (rpi5-1a2b). De image-scripts zetten
# hem in het venster van de kern (board/src/cfgwin.rs, 16 KiB).
#
# Open op het eigen LAN: de API zonder sleutel en de console over TCP.
hopos.cluster=hopos
hopos.insecure=1
hopos.console=1
hopos.cages=on
hopos.replay=0
# Waar Hop zelf woont: `system` is de OS-core naast de kern (jobs met de
# tag system delen die core), elke andere naam een eigen app-core die jobs
# met dezelfde tag delen.
hopos.hop.sharegroup=system
# De eerste job: welcome op poort 80, van de rollende release `apps`
# (jobs/README.md, het naamschema <app>-<arch>.elf).
hopos.init[]={"name":"welcome","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-arm64.elf","match":{"node.arch":"arm64"}},{"url":"https://github.com/xinix00/HopOS/releases/download/apps/welcome-riscv64.elf","match":{"node.arch":"riscv64"}}],"memory_limit":33554432,"ports":{"http":80}}
# Het glas aan de display-app (docs/gui.md): haal het hekje weg. Zonder
# deze job blijft de console van de kern op het scherm.
#hopos.init[]={"name":"display","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/HopOS/releases/download/apps/display-arm64.elf","match":{"node.arch":"arm64"}}],"memory_limit":33554432,"env":{"GUI":"display"}}
