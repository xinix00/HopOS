# HopOS v3, laag 2 van 3: dit bord (image/cfg/default.cfg zegt hoe de lagen
# samengaan). Hop op de OS-core naast de kern, groep `system`: jobs met de
# tag system delen die core. Let op: een storm van RPC's van apps kan Hop
# daar uithongeren, en daarmee de canary en de watchdog raken.
hopos.hop.sharegroup=system
