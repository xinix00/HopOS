# HopOS node config — GUI default. This file ships with every GUI release
# asset; edit it on the boot medium (FAT — any computer mounts it) and boot.
# Editing this file IS node management: no shell, no rebuild, no agent.
#
# NO EDIT IS REQUIRED to boot: write the card and the desktop comes up. The one
# edit to make before this node leaves a trusted LAN is hopos.apikey below —
# until then the API is open, and the node says so on every boot.
#
# Where it lives:  UEFI stick → next to EFI/ in the root, named hopos.cfg
#                  Raspberry Pi → on the SD bootfs, named hopos.cfg
# Format: key=value, one per line — the value is the rest of the line, so full
# job-spec JSON (same schema as the HOP API) is fine as long as it stays on one
# line. Lines starting with # are comments. Docs:
# https://github.com/xinix00/HopOS/blob/main/docs/config.md

# --- Identity (optional) ------------------------------------------------------
# Without hopos.node the node names itself after its board serial. Nodes
# sharing a hopos.cluster name form one cluster — the S3 block at the bottom
# is what actually binds them together.
#hopos.node=hop-1
#hopos.cluster=hoplab

# --- Console over the network (on by default) ----------------------------------
# The node's console — the same lines a serial cable would give you, including
# the post-mortem of a job that died — on a plain TCP port: `nc <node> 5555`.
# On by default because a node without it is diagnosable only with a cable at
# the board (04-08: a crashing app on a card without this line left us blind).
# Read-only and unauthenticated, so on a hostile network set it to 0 (off).
hopos.console=5555

# --- API key (set one before this node leaves your LAN) -------------------------
# The HTTP API (agent :8080, leader :9080) is what dispatches jobs to this node.
# Out of the box it is OPEN: no key, no authentication — so a freshly written
# card boots into a working node and you can try it in one step.
#
# That is a deliberate trade, and the node says it out loud on every boot
# ("API authentication is OFF"). Anyone who can reach it can run code on it, so
# an open node belongs on a LAN you trust and nowhere else.
#
# Close it: generate a key, put it below, and remove the insecure line. The two
# are mutually exclusive — with a key set the API authenticates, and without
# either line the node refuses to start the API at all rather than sit open by
# accident.
#
#     openssl rand -hex 24
#
# Use the SAME key on every node of a cluster.
hopos.insecure=1
#hopos.apikey=

# --- Desktop (the GUI default) -------------------------------------------------
# display + launcher ARE the desktop. They share ONE core (the "desktop"
# sharegroup — mostly-idle UI chrome); every other core stays free for real
# apps. No addresses needed anywhere: every app finds the display on its own
# node and the agent on the fixed internal address.
#
# With hopos.apikey set, give display and launcher the same key as
# "HOP_KEY":"<key>" in their env (launcher starts catalog apps, display's red
# close button deletes the job — both talk to the agent):
#   ...,"env":{"HOP_KEY":"<key>","HOPOS_APPS":""}}     (launcher)
#   ...,"env":{"HOP_KEY":"<key>","FB":"1"}}            (display)
# "FB":"1" asks for the framebuffer grant: the display renders to the real
# screen. Only one job per node can hold it; without it the desktop is still
# there over HTTP (http://<node>/kvm). A USB keyboard and mouse plugged into
# the node come with that same grant — screen and input are one seat.
# The display is the biggest app on a node, and that is arithmetic, not waste:
# at 1920x1080 the composited frame is 8.3 MB, the /kvm copy another 8.3, every
# window is double-buffered (back+front) and every connected app holds a read
# buffer as large as its largest message. Measured on a Radxa with six windows:
# 78 MB in use out of 96 — and then it fell over, because Go's GC needs room
# above the live heap, not beside it.
hopos.init[]={"name":"display","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/display.elf"}],"memory_limit":268435456,"ports":{"surf":7878,"http":80},"tags":{"sharegroup":"desktop"},"cpu_shares":1024,"env":{"FB":"1"}}
hopos.init[]={"name":"launcher","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/launcher.elf"}],"memory_limit":33554432,"tags":{"sharegroup":"desktop"},"cpu_shares":1024,"env":{"HOPOS_APPS":""}}

# --- App catalog (the hop button) ----------------------------------------------
# Not started at boot: these are the buttons in the launcher menu — one click
# starts, another click stops. They all share the "apps" pool: cpu_shares is
# the POOL size, not a per-app quota (2048 = the pool owns 2 cores; the first
# member sets the size, the rest join for free). Open more windows than the
# node has cores — they stack; RAM stays the honest ceiling.
hopos.apps[]={"name":"clock","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/clock.elf"}],"memory_limit":33554432,"tags":{"sharegroup":"apps"},"cpu_shares":2048}
hopos.apps[]={"name":"calc","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/calc.elf"}],"memory_limit":33554432,"tags":{"sharegroup":"apps"},"cpu_shares":2048}
hopos.apps[]={"name":"browser","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/browser.elf"}],"memory_limit":134217728,"tags":{"sharegroup":"apps"},"cpu_shares":2048}
hopos.apps[]={"name":"dash","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/dash.elf"}],"memory_limit":33554432,"tags":{"sharegroup":"apps"},"cpu_shares":2048}
hopos.apps[]={"name":"taskman","driver":"hop","artifacts":[{"url":"https://github.com/xinix00/hop-os-surf/releases/download/rolling-release/taskman.elf"}],"memory_limit":33554432,"tags":{"sharegroup":"apps"},"cpu_shares":2048}

# --- Live kernel updates: the flip (on by default) -----------------------------
# This node can replace its own kernel WITHOUT rebooting: the new HopOS is
# placed in memory borrowed from the app pool, the running one jumps into it,
# and the apps keep running straight through it — same cores, same partitions,
# same open connections, same mounted volumes. Their heartbeats do not even
# skip a beat. HOP's own task administration comes along too, so the node knows
# afterwards exactly what it was running.
#
# What this line does is make the node CAPABLE of it. It costs nothing on a
# node that never flips (the switch code an app core runs moves into HopOS's
# own plan region instead of the kernel image, and that is all); set it to 0
# and this node behaves exactly as it did before the feature existed.
#
# Doing an actual flip is a separate, deliberate act — see below.
hopos.flip.enable=1

# A flip is REQUESTED through the agent API — the only trigger, behind the
# same auth as job dispatch (hopos.apikey):
#   1. image/flip-bundle.sh <board>          (prints the bundle's sha256)
#   2. put the bundle on a webserver this node can reach
#   3. POST /flip {"url":...,"sha256":...} to the node's agent port

# --- S3: what makes nodes a CLUSTER (optional) ----------------------------------
# S3 is the cluster glue, not just storage. Nodes with the same hopos.cluster
# and the same S3 settings elect one leader through an S3 lock object; the
# winner advertises its address in that lock, so every node finds the leader
# without any node knowing another node's IP — and when the leader dies, the
# next node takes the lock over. The same bucket carries the committed
# cluster state: your jobs reload after any reboot or power cut.
# Leave unset for a standalone node (every boot is a clean boot, the desktop
# above is seeded fresh each time).
#hopos.s3.endpoint=https://s3.example.com
#hopos.s3.bucket=hop-prod
#hopos.s3.region=eu
#hopos.s3.key=<access-key-id>
#hopos.s3.secret=<secret-access-key>
#hopos.s3.pathstyle=1
