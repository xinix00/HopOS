# Meetbundel met de conformance-controle aan: per beeld een FNV-1a-som over de
# zichtbare bytes. Diezelfde som komt uit tools/refhash op de Mac, dus hiermee
# is "pixelperfect" hard te maken zonder een beeld van de node af te halen.
# Het hashen kost meer tijd dan het decoderen, dus de fps uit deze bundel is
# GEEN decodersnelheid.
hopos.codec=768
hopos.codecdemo=/data/clip.hevc
hopos.codecdemo.chunk=16384
hopos.codecdemo.hash=1
