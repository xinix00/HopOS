# De werkruimte van HopOS v3. Elke laag is een crate; de importrichting is
# een bouwregel (rustdoc/README.md §7): een crate gebruikt alleen wat in zijn
# eigen Cargo.toml staat, en tools/gate.sh toetst de verboden randen.
[workspace]
resolver = "3"
members = [
    "dev",
    "bounded",
    "sync",
    "executor",
    "abi",
    "cpu",
    "fw",
    "netdev",
    "blkdev",
    "driver/pl011",
    "driver/ns16550",
    "driver/gicv3",
    "driver/virtionet",
    "driver/virtioblk",
    "driver/virtiopci",
    "driver/vcmail",
    "driver/pcie",
    "driver/nic/mdio",
    "driver/nic/dwmac4",
    "driver/nic/igb",
    "driver/nvme",
    "driver/gicv2",
    "driver/nic/rtl8126",
    "board/raspi",
    "driver/nic/genet",
    "driver/scmi",
    "driver/smpro",
    "driver/dvfs",
    "board/rpi4",
    "board/rpi5",
    "driver/nic/gem",
    "driver/brcmpcie",
    "net",
    "kern",
    "board",
    "board/qemuvirt",
    "board/uefi",
    "board/rk3566",
    "board/o6n",
    "board/altra",
    "applib",
    "appspike",
    "hopos",
]
# De host-poort (cargo test, cargo clippy) draait over de bibliotheken; de
# twee binaries bouwen alleen voor een target (tools/gate.sh).
default-members = [
    "dev",
    "bounded",
    "sync",
    "executor",
    "abi",
    "cpu",
    "fw",
    "netdev",
    "driver/pl011",
    "driver/ns16550",
    "driver/gicv3",
    "driver/virtionet",
    "driver/virtioblk",
    "driver/virtiopci",
    "driver/vcmail",
    "driver/pcie",
    "driver/nic/mdio",
    "driver/nic/dwmac4",
    "driver/nic/igb",
    "driver/nvme",
    "driver/gicv2",
    "driver/nic/rtl8126",
    "board/raspi",
    "driver/nic/genet",
    "driver/scmi",
    "driver/smpro",
    "driver/dvfs",
    "board/rpi4",
    "board/rpi5",
    "driver/nic/gem",
    "driver/brcmpcie",
    "net",
    "kern",
    "board",
    "board/qemuvirt",
    "board/uefi",
    "board/rk3566",
    "board/o6n",
    "board/altra",
    "applib",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

# De harde set uit rustdoc/README.md §12. De bovenste helft is Linux'
# rust_common_flags minus wat alleen voor C-bindings bestaat; de onderste
# helft is van ons.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"

# Van ons.
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
