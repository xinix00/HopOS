# De werkruimte van HopOS v3. Elke laag is een crate; de importrichting is
# een bouwregel (rustdoc/README.md §7): een crate gebruikt alleen wat in zijn
# eigen Cargo.toml staat, en tools/gate.sh toetst de verboden randen.
[workspace]
resolver = "3"
members = [
    "dev",
    "bounded",
    "sync",
    "executor",
    "abi",
    "cpu",
    "fw",
    "netdev",
    "blkdev",
    # Het media-vlak (feature `media`, docs/media.md): het codec-contract,
    # de VPU van de O6N en de optische drive.
    "driver/codec",
    "media/mve",
    "media/optical",
    "driver/pl011",
    "driver/ns16550",
    "driver/gicv3",
    "driver/virtionet",
    "driver/virtioblk",
    "driver/virtiopci",
    "driver/vcmail",
    "driver/pcie",
    "driver/nic/mdio",
    "driver/nic/dwmac4",
    "driver/nic/dwmac",
    "driver/nic/igb",
    "driver/nvme",
    "driver/gicv2",
    "driver/nic/rtl8126",
    "board/raspi",
    "driver/nic/genet",
    "driver/scmi",
    "driver/smpro",
    "driver/dvfs",
    "driver/rng200",
    "driver/rkrng",
    "board/rpi4",
    "board/rpi5",
    "driver/nic/gem",
    "driver/brcmpcie",
    "driver/fb",
    "driver/usb/xhci",
    "driver/usb/hid",
    "driver/usb/dwc3",
    "gui/fbgrant",
    "gui/usbin",
    "gui/rkscan",
    "net",
    "kern",
    "board",
    "board/qemuvirt",
    "board/qemuvirt-riscv",
    "board/licheerv",
    "board/uefi",
    "board/rk3566",
    "board/o6n",
    "board/altra",
    "driver/aic",
    "driver/nic/tg3",
    "driver/rtkit",
    "driver/smc",
    "board/apple",
    "applib",
    "appspike",
    "apps/welcome",
    # De meetbank in het slot (de server-kant van tools/netmeter).
    "apps/bench",
    # De display-app: het glas en de invoer van de node (docs/gui.md).
    "apps/display",
    # Een stream door de videocodec van de node (docs/media.md).
    "apps/decode",
    "apps/syncprobe",
    # De board-dokter: de prestatietests van een node (apps/vitals/README.md).
    "apps/vitals",
    # De meetbank op de host: std, alleen voor de ontwikkelmachine, dus
    # geen default-member (de target-build van de bibliotheken slaat hem
    # over); tools/gate.sh toetst hem apart.
    "tools/netmeter",
    "hopos",
    "apps/cloudflared-lean",
]
# De host-poort (cargo test, cargo clippy) draait over de bibliotheken; de
# twee binaries bouwen alleen voor een target (tools/gate.sh).
default-members = [
    "dev",
    "bounded",
    "sync",
    "executor",
    "abi",
    "cpu",
    "fw",
    "netdev",
    "driver/codec",
    "media/mve",
    "media/optical",
    "driver/pl011",
    "driver/ns16550",
    "driver/gicv3",
    "driver/virtionet",
    "driver/virtioblk",
    "driver/virtiopci",
    "driver/vcmail",
    "driver/pcie",
    "driver/nic/mdio",
    "driver/nic/dwmac4",
    "driver/nic/dwmac",
    "driver/nic/igb",
    "driver/nvme",
    "driver/gicv2",
    "driver/nic/rtl8126",
    "board/raspi",
    "driver/nic/genet",
    "driver/scmi",
    "driver/smpro",
    "driver/dvfs",
    "driver/rng200",
    "driver/rkrng",
    "board/rpi4",
    "board/rpi5",
    "driver/nic/gem",
    "driver/brcmpcie",
    "driver/fb",
    "driver/usb/xhci",
    "driver/usb/hid",
    "driver/usb/dwc3",
    "gui/fbgrant",
    "gui/usbin",
    "gui/rkscan",
    "net",
    "kern",
    "board",
    "board/qemuvirt",
    "board/qemuvirt-riscv",
    "board/licheerv",
    "board/uefi",
    "board/rk3566",
    "board/o6n",
    "board/altra",
    "driver/aic",
    "driver/nic/tg3",
    "driver/rtkit",
    "driver/smc",
    "board/apple",
    "applib",
    # welcome draagt zijn paginatoetsen op de host; het image zelf bouwt
    # alleen voor een target (tools/gate.sh).
    "apps/welcome",
    # bench draagt de toetsen van zijn protocol op de host.
    "apps/bench",
    # display draagt de toetsen van zijn regellezer en zijn tekenwerk op de
    # host.
    "apps/display",
    # decode draagt de toetsen van zijn buffers en zijn meting op de host.
    "apps/decode",
    # vitals draagt de toetsen van zijn rekenkant en zijn rapporten op de
    # host.
    "apps/vitals",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

# De harde set uit rustdoc/README.md §12. De bovenste helft is Linux'
# rust_common_flags minus wat alleen voor C-bindings bestaat; de onderste
# helft is van ons.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ignored_unit_patterns = "warn"

# Van ons.
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
large_stack_arrays = "deny"

[profile.release]
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
debug = true
