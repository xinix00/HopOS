[package]
name = "cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De architectuurlaag: boot, vectoren, EL2 en stage-2, PSCI, SMP, IRQ, TRNG, memattr; de Sleeper van de executor."

[dependencies]
dev = { path = "../dev" }
abi = { path = "../abi" }
sync = { path = "../sync" }
executor = { path = "../executor" }
bounded = { path = "../bounded" }

# De XuanTie C906 (LicheeRV): het cache- en perf-regime van T-Head in de
# boot-stub van elk hart, en het cache-onderhoud van `dev`. Alleen het
# LicheeRV-board zet hem aan; op QEMU zijn het ongeldige instructies.
[features]
thead = ["dev/thead"]

