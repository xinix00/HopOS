[package]
name = "board-qemuvirt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "QEMU virt (aarch64): PL011, GICv3, virtio-net, FDT; het eerste board van v3."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
fw = { path = "../../fw" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
board = { path = "../../board" }
driver-pl011 = { path = "../../driver/pl011" }
driver-gicv3 = { path = "../../driver/gicv3" }
driver-virtionet = { path = "../../driver/virtionet" }
driver-virtioblk = { path = "../../driver/virtioblk" }
# De framebuffer-beschrijving van `Board::framebuffer` (ramfb.rs).
driver-fb = { path = "../../driver/fb" }
# De qemu-xhci op de PCIe-host (usb.rs), alleen met `gui`.
driver-pcie = { path = "../../driver/pcie", optional = true }

[lints]
workspace = true

[features]
default = []
# `-device ramfb` over fw_cfg (ramfb.rs): de console op het glas in QEMU,
# en de qemu-xhci op PCIe (usb.rs).
gui = ["dep:driver-pcie"]
