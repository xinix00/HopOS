[package]
name = "board-uefi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Het generieke UEFI-board: de PE-stub, de EFI-memory-map, ACPI (MADT, MCFG, SPCR), GICv3, PCIe en virtio over PCI; de basis van de O6N en de Altra."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
fw = { path = "../../fw" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
bounded = { path = "../../bounded" }
board = { path = "../../board" }
driver-pl011 = { path = "../../driver/pl011" }
driver-ns16550 = { path = "../../driver/ns16550" }
driver-gicv3 = { path = "../../driver/gicv3" }
driver-pcie = { path = "../../driver/pcie" }
driver-virtiopci = { path = "../../driver/virtiopci" }
driver-virtionet = { path = "../../driver/virtionet" }
driver-virtioblk = { path = "../../driver/virtioblk" }
# De NVMe van de O6N en de Altra (pcie.rs `probe_nvme`).
driver-nvme = { path = "../../driver/nvme" }
# De framebuffer-beschrijving van `Board::framebuffer` (gop.rs).
driver-fb = { path = "../../driver/fb" }

[lints]
workspace = true

[features]
default = []
# Het kernvenster op 0x8800_0000 in plaats van 0x5000_0000: voor boards met
# DRAM vanaf 0x8000_0000 (de O6N). Zie `WINDOW_PA`.
window-8000 = []
# Het kernvenster op 0xB000_0000: de Altra, Go's eerste kandidaat (13-07:
# 0x9000_0000 bezet, en dat ligt in het venster van `window-8000`). Wint
# van `window-8000` als beide aan staan. Zie `WINDOW_PA`.
window-b000 = []
# De GOP-framebuffer (gop.rs): alleen de gui-smaak leest en mapt hem.
gui = []
# De kern onder E2H = 1 (src/el2.rs): HCR, TCR, SCTLR, CPTR en CNTHCTL in
# de VHE-vorm, PXN in de map. Hoort bij de switcher-smaak `Vhe` van de
# binary (hopos/src/cage.rs `FLAVOR`, getoetst bij het bouwen). De O6N zet
# hem altijd aan (A720: nVHE-EL1 stierf binnen 0,5 s, Go 17-09); op QEMU
# is het de proef met `FEATURES=vhe CPU=neoverse-n1`.
vhe = []
