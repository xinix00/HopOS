[package]
name = "board-licheerv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"
description = "Sipeed LicheeRV Nano (SG2002, XuanTie C906) in machine mode: ns16550, dwmac met de interne ePHY, CLINT, PLIC, de T-Head-caches, de DW-watchdog."

[dependencies]
dev = { path = "../../dev", features = ["thead"] }
abi = { path = "../../abi" }
cpu = { path = "../../cpu", features = ["thead"] }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
fw = { path = "../../fw" }
netdev = { path = "../../netdev" }
net = { path = "../../net" }
board = { path = "../../board" }
driver-ns16550 = { path = "../../driver/ns16550" }
driver-mdio = { path = "../../driver/nic/mdio" }
driver-dwmac = { path = "../../driver/nic/dwmac" }

# De boot-hart-loterij (src/lottery.rs): de kern op de C906L, de apps op de
# C906B. Uit sinds 03-10: de PLIC van de C906L heeft geen ethernetbron, de
# kern hoort op de C906B voor de dwmac-interrupt.
[features]
lottery = ["cpu/lottery"]

[lints]
workspace = true
