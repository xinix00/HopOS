[package]
name = "board-rk3566"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Radxa Zero 3E (Rockchip RK3566): U-Boot-boot met DTB, DW-APB-UART, GIC-600, DWMAC4 met RTL8211F, de SoC-glue eronder."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
fw = { path = "../../fw" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
net = { path = "../../net" }
board = { path = "../../board" }
driver-ns16550 = { path = "../../driver/ns16550" }
driver-gicv3 = { path = "../../driver/gicv3" }
driver-mdio = { path = "../../driver/nic/mdio" }
driver-stmmac = { path = "../../driver/nic/stmmac", default-features = false, features = ["dwmac4"] }
# Het TRNG-blok van de SoC: de bron van de DRBG van de kern (rng.rs).
driver-rkrng = { path = "../../driver/rkrng" }
# De beschrijving van een framebuffer (`Board::framebuffer`): ook zonder
# `gui` nodig, want de stub geeft hetzelfde type (`None`).
driver-fb = { path = "../../driver/fb" }
# De beeldketen (PD_VO, VOP2, DW-HDMI): alleen met `gui`. Een headless node
# draagt geen regel display-code (Go: "geen dood gewicht", Derek 06-08).
gui-rkscan = { path = "../../gui/rkscan", optional = true }

[features]
# De eigen scanout naar HDMI: `framebuffer()` start de keten en geeft de
# buffer uit het plan. Zonder deze feature is het board headless.
gui = ["dep:gui-rkscan"]

[lints]
workspace = true
