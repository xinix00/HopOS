[package]
name = "board-rk3566"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Radxa Zero 3E (Rockchip RK3566): U-Boot-boot met DTB, DW-APB-UART, GIC-600, DWMAC4 met RTL8211F, de SoC-glue eronder."

[dependencies]
dev = { path = "../../dev" }
abi = { path = "../../abi" }
cpu = { path = "../../cpu" }
fw = { path = "../../fw" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
net = { path = "../../net" }
board = { path = "../../board" }
driver-ns16550 = { path = "../../driver/ns16550" }
driver-gicv3 = { path = "../../driver/gicv3" }
driver-mdio = { path = "../../driver/nic/mdio" }
driver-dwmac4 = { path = "../../driver/nic/dwmac4" }
# Alleen voor het type van `probe_disk`: de opslag van de kern-binary kent
# vandaag één schijf-type. Dit board heeft (nog) geen SD/eMMC-driver en
# geeft altijd `Ok(None)`.
driver-virtioblk = { path = "../../driver/virtioblk" }

[lints]
workspace = true
