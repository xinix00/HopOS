[package]
name = "board-o6n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De Radxa Orion O6N (Cix P1): het UEFI-board plus de RTL8125/8126, de NVMe, de SCMI-thermometer, de _CPC-klok en de core-klassen."

[dependencies]
dev = { path = "../../dev" }
cpu = { path = "../../cpu" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
# Het generieke UEFI-board. Het kernvenster voor DRAM op 0x8000_0000
# (`window-8000`) zet de binary aan (hopos/Cargo.toml), zodat de
# host-tests van de werkruimte het standaardvenster houden.
# `net-wb`: het bufferblok van de NIC Normal-WB (board-uefi `NET_BUF`). De
# rtl8126 veegt zelf (push vóór TX, pull na RX), en de Go-kern mapte de
# frame-buffers van dit board ook zo (uefi/hop/board.go, 17-07).
board-uefi = { path = "../uefi", features = ["net-wb"] }
bounded = { path = "../../bounded" }
board = { path = "../../board" }
driver-pcie = { path = "../../driver/pcie" }
driver-rtl8126 = { path = "../../driver/nic/rtl8126" }
driver-nvme = { path = "../../driver/nvme" }
driver-scmi = { path = "../../driver/scmi" }
driver-dvfs = { path = "../../driver/dvfs" }

# De `_PRT`-toets van `probe::nic_intid` tegen de echte DSDT.
[dev-dependencies]
fw = { path = "../../fw" }

# Geen doc-voorbeelden: de doctest-ronde zou alleen de hele
# UEFI-board-boom opnieuw linken.
[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
# De GOP-framebuffer van de firmware (board-uefi, gop.rs).
gui = ["board-uefi/gui"]
# De VPU aanzetten (src/codec.rs): vensters uit de DSDT, stroom en klokken
# via SCMI, de stroomcyclus bij een vastgelopen blok (docs/media.md).
media = []
# De twee keuzes van het UEFI-board die de binary voor de O6N altijd
# aanzet (hopos/Cargo.toml `board-o6n`), en de host-tests van de werkruimte
# niet: het kernvenster voor DRAM op 0x8000_0000, en de kern onder E2H = 1
# (board/uefi/src/el2.rs; de A720 eist VHE, Go 17-09).
window-8000 = ["board-uefi/window-8000"]
vhe = ["board-uefi/vhe"]
