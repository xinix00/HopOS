[package]
name = "board-o6n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De Radxa Orion O6N (Cix P1): het UEFI-board plus de RTL8125/8126, de NVMe, de SCMI-thermometer, de _CPC-klok en de core-klassen."

[dependencies]
dev = { path = "../../dev" }
cpu = { path = "../../cpu" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
# Het generieke UEFI-board. Het kernvenster voor DRAM op 0x8000_0000
# (`window-8000`) zet de binary aan (hopos/Cargo.toml), zodat de
# host-tests van de werkruimte het standaardvenster houden.
board-uefi = { path = "../uefi" }
bounded = { path = "../../bounded" }
board = { path = "../../board" }
driver-pcie = { path = "../../driver/pcie" }
driver-rtl8126 = { path = "../../driver/nic/rtl8126" }
driver-nvme = { path = "../../driver/nvme" }
driver-scmi = { path = "../../driver/scmi" }
driver-dvfs = { path = "../../driver/dvfs" }

# Geen doc-voorbeelden: de doctest-ronde zou alleen de hele
# UEFI-board-boom opnieuw linken.
[lib]
doctest = false

[lints]
workspace = true
