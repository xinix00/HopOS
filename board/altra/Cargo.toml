[package]
name = "board-altra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De Ampere Altra (en AmpereOne): het UEFI-board plus de igb-NIC, de NVMe en de SMpro-thermometer."

[dependencies]
dev = { path = "../../dev" }
cpu = { path = "../../cpu" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
bounded = { path = "../../bounded" }
# Het generieke UEFI-board. Het kernvenster voor DRAM op 0x8000_0000
# (`window-8000`) zet de binary aan (hopos/Cargo.toml), zodat de
# host-tests van de werkruimte het standaardvenster houden.
board-uefi = { path = "../uefi" }
board = { path = "../../board" }
driver-pcie = { path = "../../driver/pcie" }
driver-igb = { path = "../../driver/nic/igb" }
driver-nvme = { path = "../../driver/nvme" }
driver-smpro = { path = "../../driver/smpro" }

# Geen doc-voorbeelden: de doctest-ronde zou alleen de hele
# UEFI-board-boom opnieuw linken.
[lib]
doctest = false

[lints]
workspace = true
