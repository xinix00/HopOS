[package]
name = "board-altra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De Ampere Altra (en AmpereOne): het UEFI-board plus de igb-NIC, de NVMe en de SMpro-thermometer."

[dependencies]
dev = { path = "../../dev" }
cpu = { path = "../../cpu" }
sync = { path = "../../sync" }
executor = { path = "../../executor" }
netdev = { path = "../../netdev" }
bounded = { path = "../../bounded" }
# Het generieke UEFI-board. Het kernvenster van de Altra (`window-b000`)
# zet de binary aan (hopos/Cargo.toml), zodat de host-tests van de
# werkruimte het standaardvenster houden.
board-uefi = { path = "../uefi" }
board = { path = "../../board" }
driver-pcie = { path = "../../driver/pcie" }
driver-igb = { path = "../../driver/nic/igb" }
driver-nvme = { path = "../../driver/nvme" }
driver-smpro = { path = "../../driver/smpro" }

# Geen doc-voorbeelden: de doctest-ronde zou alleen de hele
# UEFI-board-boom opnieuw linken.
[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
# De GOP-framebuffer van de firmware (board-uefi, gop.rs), zoals op de O6N.
gui = ["board-uefi/gui"]
# Het kernvenster op 0xB000_0000 (board-uefi `WINDOW_PA`), Go's eerste
# kandidaat op de Altra: 0x9000_0000 bleek daar bezet (13-07), en dat ligt
# in het O6N-venster 0x8800_0000+320 MB. De binary zet het altijd aan
# (hopos/Cargo.toml `board-altra`), de host-tests van de werkruimte niet.
window-b000 = ["board-uefi/window-b000"]
