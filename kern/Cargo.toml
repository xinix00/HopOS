[package]
name = "kern"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De orchestrator-mechanismen: slots en partities, de kooi, de system-API, hopfs, de kern-flip, de console."

[dependencies]
blkdev = { path = "../blkdev" }
# De fundamenten en de ABI; de ijzerkant komt binnen als traits
# (src/cage.rs), zodat `cpu`, `board` en `net` erop aansluiten zonder dat de
# kern van hen afhangt.
abi = { path = "../abi" }
sync = { path = "../sync" }
bounded = { path = "../bounded" }
# De lezer van `hopos.cfg` (src/nodecfg.rs): één parser voor elk kanaal.
fw = { path = "../fw" }
# De ELF-lezer van de plaatsing (STREAM_IMAGE na de laatste byte): no_std,
# geen allocatie, geen build.rs. Getagd over de repo-grens (PORT.md §6
# beslissing 6), nooit een pad.
leanelf = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.6" }
# Het codec-contract (feature `media`): de codec-dienst hangt aan het
# contract, niet aan een driver (src/codecabi.rs, docs/media.md).
driver-codec = { path = "../driver/codec", optional = true }

[features]
default = []
# De codec-ops van de system-API (src/codecabi.rs). Zonder deze feature
# antwoorden ze "onbekende op", zoals de Go-kern buiten de media-smaak.
media = ["dep:driver-codec"]

[lints]
workspace = true
