# Orion O6N media-node: de lokale opstelling van Derek. In het venster van
# de kern (docs/boards.md, "Het config-venster"), in de media-smaak:
#   CFG=jobs/hopos-media-o6n.cfg MEDIA=1 BOARD=o6n sh image/uefi-run.sh
# of op een bestaande stick met `hop image ... --config`. Een eigen config
# vervangt de gedeelde (image/cfg) helemaal; de sleutels staan in
# kern/src/nodecfg.rs. De compacte init-job is gelijk aan job-lumen.json
# hiernaast; het ELF komt bij elke koude start van de Mac op :8002
# (docs/media.md). De opslag is in v3 altijd stateful.

hopos.node=hopos-1
hopos.insecure=1
hopos.console=1
hopos.clock=dvfs
hopos.codec=768

# Alleen Lumen; geen display, launcher, welcome of andere init-jobs.
hopos.init[]={"name":"lumen","driver":"hop","artifacts":[{"url":"http://192.168.1.208:8002/lumen-20260928-1.elf","match":{"node.arch":"arm64"}}],"ports":{"http":8099,"ui":8098},"cpu_shares":11264,"memory_limit":25769803776,"env":{"WEBDAV_MOUNTS":"/mounts","WEBDAV_ROOT":"/media","WEBDAV_WRITE":"1","WEBDAV_BACKUP_PROFILE":"faster-b2","WEBDAV_STORAGE":"stateful"},"volumes":{"/devices":"/mounts","/mediakeys":"/aacs","/medialib":"/media","/firmware":"/codec-firmware","/lumen-notifications":"/notifications"},"max_restarts":0,"update_policy":"recreate","priority":0,"affinity":{"node.id":"hopos-1"}}
