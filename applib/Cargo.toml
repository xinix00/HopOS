[package]
name = "applib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "De app-runtime: executor, ringen, system-API-client, de main-schil. Rust-apps linken hiertegen."
build = "build.rs"

[dependencies]
heap = { path = "../heap" }
dev = { path = "../dev" }
abi = { path = "../abi" }
sync = { path = "../sync" }
executor = { path = "../executor" }
bounded = { path = "../bounded" }
netdev = { path = "../netdev" }
# De netstack (PORT.md §2.1), op een tag en nooit over een pad: lean is een
# eigen repo met een eigen poort. Met de IPv6-baan (`Udp6Socket`,
# `ipv6_addresses`; Stulp praat Matter over IPv6); de kern bouwt zonder.
leannet = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11", features = ["ipv6"] }
# De codec-namen en -nummers (feature `media`, src/codec.rs): dezelfde
# nummering als de kern, uit het contract zelf.
driver-codec = { path = "../driver/codec", optional = true }
# De brug naar leanhttp (feature `http`, src/tcp.rs): dezelfde tag als Hop,
# zodat `hop-http` en de apps één `AsyncRead` kennen.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.11", optional = true }

[features]
default = []
# De codec-client (src/codec.rs, docs/media.md).
media = ["dep:driver-codec"]
# De `TcpConn`-brug tussen `appnet::TcpStream` en leanhttp (src/tcp.rs).
http = ["dep:leanhttp"]

[lints]
workspace = true
