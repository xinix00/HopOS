[package]
name = "net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Het netwerkvlak van de kern: de switch (L2 over de frame-ringen), NAT, de host-poort, DHCP-lijm."

[dependencies]
dev = { path = "../dev" }
abi = { path = "../abi" }
sync = { path = "../sync" }
executor = { path = "../executor" }
