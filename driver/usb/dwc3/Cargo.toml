[package]
name = "driver-dwc3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Een Synopsys DWC3-core in hostmodus, zodat het xHCI-venster eronder leeft (de RK3566)."

[dependencies]
dev = { path = "../../../dev" }
# De klok en de slaap van de USB-taak (`driver_xhci::Timer`): een DWC3 in
# hostmodus is een xHCI, en de reset slaapt op dezelfde taak.
driver-xhci = { path = "../xhci" }

[lints]
workspace = true
