[package]
name = "driver-stmmac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Synopsys DesignWare MAC (stmmac): één kern voor reset, MDIO, ringen en het frame-pad, met een ops-tabel per generatie: DWMAC1000 (de SG2002 van de LicheeRV Nano) en DWMAC4/EQOS (het GMAC1 van de RK3566)."

[dependencies]
dev = { path = "../../../dev" }
sync = { path = "../../../sync" }
netdev = { path = "../../../netdev" }
driver-mdio = { path = "../mdio" }

# Eén feature per generatie: het board zet de zijne aan
# (`default-features = false`), zodat een image alleen zijn eigen core draagt
# (en `loc` hem alleen bij dat board telt). De werkruimte en de toetsen
# bouwen beide.
[features]
default = ["dwmac1000", "dwmac4"]
dwmac1000 = []
dwmac4 = []

[lints]
workspace = true
